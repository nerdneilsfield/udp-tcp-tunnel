# GoReleaser v2: separate server (Linux only) and client archives.
version: 2

project_name: udp-tcp-tunnel

builds:
  - id: server
    main: ./cmd/udp-tcp-tunnel-server
    binary: udp-tcp-tunnel-server
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/nerdneilsfield/udp-tcp-tunnel/internal/buildinfo.Version={{ .Version }}
      - -X github.com/nerdneilsfield/udp-tcp-tunnel/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/nerdneilsfield/udp-tcp-tunnel/internal/buildinfo.Date={{ .Date }}

  - id: client
    main: ./cmd/udp-tcp-tunnel-client
    binary: udp-tcp-tunnel-client
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/nerdneilsfield/udp-tcp-tunnel/internal/buildinfo.Version={{ .Version }}
      - -X github.com/nerdneilsfield/udp-tcp-tunnel/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/nerdneilsfield/udp-tcp-tunnel/internal/buildinfo.Date={{ .Date }}

archives:
  - id: server
    ids: [server]
    formats: [tar.gz]
    name_template: "udp-tcp-tunnel-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/*
      - src: examples/server.yaml
        dst: server.yaml
      - src: examples/server-quic.yaml
        dst: server-quic.yaml
      - src: examples/server-kcp.yaml
        dst: server-kcp.yaml
  - id: client
    ids: [client]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "udp-tcp-tunnel-client_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - docs/*
      - src: examples/client.yaml
        dst: client.yaml
      - src: examples/client-multi.yaml
        dst: client-multi.yaml
      - src: examples/client-quic.yaml
        dst: client-quic.yaml
      - src: examples/client-kcp.yaml
        dst: client-kcp.yaml
      - src: examples/client-full.yaml
        dst: client-full.yaml

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
