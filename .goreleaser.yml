version: 2
builds:
  - id: server
    main: ./cmd/udp-tcp-tunnel-server
    binary: udp-tcp-tunnel-server
    flags: [-tags=server]
    goos: [linux]
    goarch: [amd64, arm64]
  - id: client
    main: ./cmd/udp-tcp-tunnel-client
    binary: udp-tcp-tunnel-client
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - id: server
    ids: [server]
    name_template: 'udp-tcp-tunnel-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
  - id: client
    ids: [client]
    name_template: 'udp-tcp-tunnel-client_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides: [{goos: windows, formats: [zip]}]
checksum: {name_template: checksums.txt}
changelog: {sort: asc}
