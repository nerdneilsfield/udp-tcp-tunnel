# udp-tcp-tunnel-server configuration.
# Run: udp-tcp-tunnel-server -c server.yaml
# Every key is described in
# https://github.com/nerdneilsfield/udp-tcp-tunnel/blob/master/docs/configuration.md

# TCP address the client connects to. Default ":9000" (all addresses).
# On an address other than loopback, set a token and enable TLS; the server
# logs a warning at startup when either is missing.
listen: ":9000"

# How UDP datagrams are obtained. Default "socket".
#   socket    bind the destination ports below; no other program can bind them
#   afpacket  copy matching packets from `interface` while the program that
#             owns the port keeps receiving them (Linux only, needs root or
#             CAP_NET_RAW: sudo setcap cap_net_raw+ep udp-tcp-tunnel-server)
capture: socket

# socket mode: IP address to bind the UDP ports on. Default "0.0.0.0".
udp_bind: "0.0.0.0"

# afpacket mode: interface to capture on. Check the traffic first with
#   sudo tcpdump -ni eth0 -Q in 'udp and dst port 2368'
# interface: eth0

# Datagrams that can wait for the TCP writer. When the queue is full, the
# newest datagram is dropped and counted as queue_full. Default 1024.
queue_size: 1024

# Larger payloads are dropped and counted as oversized. Range 1 to 65535,
# default 65535.
max_payload: 65535

# Interval between stats log lines, as a Go duration. Default 10s.
stats_interval: 10s

# Payload compression: none (default), zstd or s2. The other end must use the
# same value, or the handshake fails. Details in docs/configuration.md.
# compression: none

# Shared secret that the client must present, at most 255 bytes. Without TLS
# it crosses the network in clear text.
token: change-me

# tls:
#   enabled: true
#   cert_file: /etc/udp-tcp-tunnel/server.crt
#   key_file: /etc/udp-tcp-tunnel/server.key

# Each channel needs a unique id (1 to 65535) that the client also lists, and
# a destination_port. source_ip and source_port are optional. A datagram
# belongs to the most specific matching channel:
# source_ip+source_port > source_ip > source_port > destination_port only.
# Datagrams that match no channel are counted as unknown_channel.
channels:
  - id: 1
    name: lidar-201
    source_ip: 192.168.1.201
    destination_port: 2368
  - id: 2
    name: lidar-202
    source_ip: 192.168.1.202
    destination_port: 2368
