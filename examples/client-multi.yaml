# udp-tcp-tunnel-client configuration with several tunnel servers.
# Run: udp-tcp-tunnel-client -c client-multi.yaml
# Do not set top-level `server` or `channels` together with `upstreams`.
# Every key is described in
# https://github.com/nerdneilsfield/udp-tcp-tunnel/blob/master/docs/configuration.md

# Shared defaults. An upstream inherits token, tls and reconnect backoff when
# it omits them. stats_interval stays top-level only.
reconnect_backoff_min: 1s
reconnect_backoff_max: 30s
stats_interval: 10s

# Each upstream may set its own `compression` (none, zstd or s2); it must match
# that server. An upstream that omits it inherits this value.
# compression: none
token: change-me

# tls:
#   enabled: true
#   ca_file: /etc/udp-tcp-tunnel/ca.crt
#   server_name: tunnel.example.com
#   insecure_skip_verify: false

# One TCP(+TLS) session per upstream. Channel IDs are per upstream: both may
# use id 1 with different local targets. Names must be unique; they appear in
# logs and stats as upstream=<name>.
upstreams:
  - name: east
    server: "192.168.1.10:9000"
    channels:
      - id: 1
        name: lidar-201
        target: "127.0.0.1:2368"
      - id: 2
        name: lidar-202
        target: "127.0.0.1:2369"
  - name: west
    server: "192.168.1.11:9000"
    # token: other-secret   # overrides the top-level token for this upstream
    channels:
      - id: 1
        name: camera-1
        target: "127.0.0.1:5000"
