# udp-tcp-tunnel-client configuration.
# Run: udp-tcp-tunnel-client -c client.yaml
# Every key is described in
# https://github.com/nerdneilsfield/udp-tcp-tunnel/blob/master/docs/configuration.md

# Address of udp-tcp-tunnel-server as host:port. Required for the
# single-upstream shape. To dial several servers from one process, use
# `upstreams` instead (see examples/client-multi.yaml) and omit `server`
# and top-level `channels`.
server: "192.168.1.10:9000"

# The reconnect delay starts at the minimum, doubles after each failed attempt
# and stops growing at the maximum. Defaults 1s and 30s.
reconnect_backoff_min: 1s
reconnect_backoff_max: 30s

# Interval between stats log lines, as a Go duration. Default 10s.
stats_interval: 10s

# Payload compression: none (default), zstd or s2. The other end must use the
# same value, or the handshake fails. Details in docs/configuration.md.
# compression: none

# Must equal the server's token.
token: change-me

# tls:
#   enabled: true
#   ca_file: /etc/udp-tcp-tunnel/ca.crt   # replaces the system roots; omit to use them
#   server_name: tunnel.example.com        # defaults to the host in `server`
#   insecure_skip_verify: false            # testing only

# Every id must also exist on the server. The client sends each datagram of a
# channel, unchanged, to `target` from one local UDP socket per channel, so the
# receiver sees this machine as the source. Targets are resolved once at startup.
channels:
  - id: 1
    name: lidar-201
    target: "127.0.0.1:2368"
  - id: 2
    name: lidar-202
    target: "127.0.0.1:2369"
