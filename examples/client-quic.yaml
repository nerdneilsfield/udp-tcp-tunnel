# udp-tcp-tunnel-client configuration for the QUIC transport.
# Run: udp-tcp-tunnel-client -c client-quic.yaml
# Every key is described in
# https://github.com/nerdneilsfield/udp-tcp-tunnel/blob/master/docs/configuration.md

# Single-upstream shape. In the upstreams shape, set `transport` per upstream
# or at the top level as the default.
transport: quic
server: "192.168.1.10:9000"      # UDP port of the QUIC server

reconnect_backoff_min: 1s
reconnect_backoff_max: 30s
stats_interval: 10s

# Payload compression, applied to every datagram on its own. The server must
# use the same algorithm. Algorithms: none (default), zstd, s2. Shorthand
# `compression: zstd` or a mapping with a level (zstd 1-4, s2 1-3; default 1).
compression:
  algorithm: zstd
  level: 1
token: change-me

# QUIC always uses TLS 1.3, so tls is mandatory.
tls:
  enabled: true
  ca_file: /etc/udp-tcp-tunnel/ca.crt
  # server_name: tunnel.example.com   # default: host part of `server`
  # insecure_skip_verify: false

channels:
  - id: 1
    name: lidar-201
    target: "127.0.0.1:2368"
  - id: 2
    name: lidar-202
    target: "127.0.0.1:2369"
