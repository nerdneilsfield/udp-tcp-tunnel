version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/nerdneilsfield/go-template

linters:
  default: standard
  enable:
    - revive
  settings:
    govet:
      enable:
        - shadow
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
